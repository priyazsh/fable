# Cross-platform release builds.
#
# Windows installers cannot be cross-compiled from Linux — they need the MSVC
# toolchain and WiX — so each target builds on its own runner.
#
# AppImage is built on ubuntu-22.04 deliberately. linuxdeploy bundles an old
# binutils and assumes a Debian filesystem layout, so it fails on rolling
# distributions (Arch: unknown `.relr.dyn` sections, missing
# /usr/lib/gdk-pixbuf-2.0/2.10.0). Ubuntu is the supported host for it.
#
# Tag a release to publish:  git tag v0.1.0 && git push --tags
# Or run manually from the Actions tab to get artifacts without publishing.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux
            # 22.04 ships webkit2gtk 4.1, which Tauri 2 needs.
            bundles: deb,appimage
          - os: windows-latest
            target: windows
            bundles: nsis,msi

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.target }}

    steps:
      - uses: actions/checkout@v4

      - name: Locate the project
        id: locate
        shell: bash
        run: |
          manifest=$(find . -name Cargo.toml -path '*src-tauri*' \
            -not -path '*/target/*' -not -path '*/node_modules/*' | head -1)
          if [ -z "$manifest" ]; then
            echo "::error::No src-tauri/Cargo.toml found anywhere in the checkout."
            find . -maxdepth 3 -name '*.toml' -o -maxdepth 3 -name package.json | head -20
            exit 1
          fi
          native=$(dirname "$manifest")
          app=$(dirname "$native")
          echo "native=$native" >> "$GITHUB_OUTPUT"
          echo "app=$app"       >> "$GITHUB_OUTPUT"
          echo "Found the native core at $native, the app at $app"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ${{ steps.locate.outputs.native }}

      - name: Install Linux build dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2

      - name: Install frontend dependencies
        working-directory: ${{ steps.locate.outputs.app }}
        run: bun install --frozen-lockfile

      - name: Test native core
        working-directory: ${{ steps.locate.outputs.native }}
        run: cargo test

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ${{ steps.locate.outputs.app }}
          tagName: ${{ github.ref_name }}
          releaseName: Forge ${{ github.ref_name }}
          releaseDraft: true
          args: --bundles ${{ matrix.bundles }}

      - name: Upload artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: forge-${{ matrix.target }}
          path: |
            ${{ steps.locate.outputs.native }}/target/release/bundle/deb/*.deb
            ${{ steps.locate.outputs.native }}/target/release/bundle/appimage/*.AppImage
            ${{ steps.locate.outputs.native }}/target/release/bundle/nsis/*.exe
            ${{ steps.locate.outputs.native }}/target/release/bundle/msi/*.msi
          if-no-files-found: ignore
