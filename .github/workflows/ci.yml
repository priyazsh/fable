# Runs on every push and pull request. Compiles and tests on both target
# platforms without producing installers, so Windows regressions surface
# before a release rather than during one.

name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # The project does not have to sit at the repository root, so find it
      # rather than assuming. Without this, a nested checkout fails with a
      # bare "manifest path does not exist".
      - name: Locate the project
        id: locate
        shell: bash
        run: |
          manifest=$(find . -name Cargo.toml -path '*src-tauri*' \
            -not -path '*/target/*' -not -path '*/node_modules/*' | head -1)
          if [ -z "$manifest" ]; then
            echo "::error::No src-tauri/Cargo.toml found anywhere in the checkout."
            find . -maxdepth 3 -name '*.toml' -o -maxdepth 3 -name package.json | head -20
            exit 1
          fi
          native=$(dirname "$manifest")
          app=$(dirname "$native")
          echo "native=$native" >> "$GITHUB_OUTPUT"
          echo "app=$app"       >> "$GITHUB_OUTPUT"
          echo "Found the native core at $native, the app at $app"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ${{ steps.locate.outputs.native }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev

      - name: Install frontend dependencies
        working-directory: ${{ steps.locate.outputs.app }}
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: ${{ steps.locate.outputs.app }}
        run: bun run typecheck

      - name: Test frontend
        working-directory: ${{ steps.locate.outputs.app }}
        run: bun test

      - name: Build frontend
        working-directory: ${{ steps.locate.outputs.app }}
        run: bun run build

      - name: Format check
        working-directory: ${{ steps.locate.outputs.native }}
        run: cargo fmt -- --check

      - name: Clippy
        working-directory: ${{ steps.locate.outputs.native }}
        run: cargo clippy -- -D warnings

      - name: Test native core
        working-directory: ${{ steps.locate.outputs.native }}
        run: cargo test
